          {

          {
            "id": "C26B007",

            "difficulty": "✅ Basic",
            "difficulty_level": 1,
            "sf": 1
          },
          {
            "id": "C26B010",

            "difficulty": "📈 Advanced",
            "difficulty_level": 2,

          {

          },
          {
            "id": "C26B016",
            "text": "Rubidium is an element in Group I of the Periodic Table. Which of the following is/are the expected observation(s) when a small piece of rubidium is added to a trough of water containing methyl orange?<br>(1)\t The small piece of rubidium catches fire.<br>(2)\t The piece of rubidium sinks into water.<br>(3)\t The resultant solution in the trough is yellow in colour.",

            "difficulty": "🔥 Challenge",
            "difficulty_level": 3,
            "sf": 0
          },
          {
            "id": "C26B017",
            "text": "Strontium is a Group II element below calcium in the Periodic Table. Which of the following statements about strontium is/are correct?<br>(1)\t It reacts with oxygen to form an ionic compound.<br>(2)\t It reacts with water less vigorously than calcium.<br>(3)\t It is a solid at room temperature and pressure.",

            "difficulty": "🔥 Challenge",
            "difficulty_level": 3,
            "sf": 0
          },
          {
            "id": "C26B018",
            "text": "Which of the following statements about halogens is correct?",

            "sf": 1

          {
            "id": "C26B019",
            "text": "Which of the following statements about Group VII elements of the Periodic Table is/are correct?<br>(1)\t The number of electrons of the elements increases down the group.<br>(2)\t The reactivity of the elements increases down the group.<br>(3)\t The boiling points of the elements decrease down the group.",
